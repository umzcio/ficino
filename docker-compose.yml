# Ficino: the TypeScript server stack (postgres, api, worker, web).
#
# Generic on purpose: this file publishes no port and names no host. Reach the web service
# through an override (see deploy/README.md): copy one of the deploy/*/docker-compose.override.example.yml
# files to docker-compose.override.yml, which compose layers on top of this file automatically.
#
# Configuration comes from .env (copy .env.example), which only the api and worker read. The server
# image fails closed: it runs with ENVIRONMENT=production, and in production the api and worker refuse
# to start without SIGNED_URL_KEY. Postgres reads only postgres.env (copy postgres.env.example) and
# initialises only with POSTGRES_PASSWORD set there.
name: ficino

x-server: &server
  image: ficino-server:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
  # One volume per directory; the api and the worker read and write the same files.
  volumes:
    - uploads:/app/uploads
    - figures:/app/figures
    - media:/app/media
  networks:
    - ficino-network

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: ficino-postgres
    restart: unless-stopped
    # The password comes only from postgres.env (POSTGRES_PASSWORD), never from interpolation, and
    # never from .env: that file holds the app's secrets, which Postgres has no use for. It is read
    # when Postgres initialises an empty volume; rotating it later also needs ALTER USER.
    env_file:
      - path: postgres.env
        required: false
    environment:
      POSTGRES_USER: ficino
      POSTGRES_DB: ficino
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ficino -d ficino"]
      interval: 5s
      timeout: 3s
      retries: 10
    # pg18 images keep PGDATA under /var/lib/postgresql/<major>/docker; mount the parent.
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - ficino-network

  api:
    <<: *server
    build: ./server
    container_name: ficino-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 20s

  worker:
    <<: *server
    # Same image as the api (built by the api service); never pulled.
    pull_policy: never
    container_name: ficino-worker
    command: ["node", "dist/worker/main.js"]
    # The image's HEALTHCHECK probes the api port, which the worker does not serve.
    healthcheck:
      disable: true
    # close() gives pg-boss 30 s to stop gracefully, then up to 10 s for aborted handlers' writes.
    stop_grace_period: 45s

  web:
    build: ./frontend
    image: ficino-web:local
    container_name: ficino-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ficino-network

volumes:
  pgdata:
  uploads:
  figures:
  media:

networks:
  ficino-network:
    name: ficino-network
    driver: bridge
