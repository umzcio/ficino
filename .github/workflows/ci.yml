name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      # The test harness starts pgvector/pgvector:pg18 with the docker CLI (preinstalled on runners).
      - run: cd server && npm ci && npm run typecheck && npm test

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.lock
            worker/requirements.lock
      - run: pip install ruff==0.15.20
      - run: ruff check api/ worker/ shared/

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # matches docker-compose.yml
        env:
          POSTGRES_USER: ficino
          POSTGRES_PASSWORD: ficino
          POSTGRES_DB: ficino
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ficino"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://ficino:ficino@localhost:5432/ficino
      REDIS_URL: redis://localhost:6379/0
      AUTH_PROVIDER: none
      ENVIRONMENT: test
      # Settings.upload_dir/figures_dir default to /app/... (the container
      # image's writable app root). The runner has no /app and can't create
      # one without sudo, so tests that write real files (e.g.
      # test_signed_figures.py) need these repointed at a writable path.
      # (job-level `env:` can't read the `runner` context, so this uses a
      # plain /tmp path rather than `${{ runner.temp }}`.)
      UPLOAD_DIR: /tmp/ficino-ci-uploads
      FIGURES_DIR: /tmp/ficino-ci-figures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.lock
            worker/requirements.lock
      - run: pip install -r api/requirements.lock
      - run: pip install -r api/requirements-dev.txt
      - run: pip install ./shared
      - name: Load schema
        # init.sql is the FULL schema (migrations folded in — keep it that
        # way: any new add_*.sql must be folded into init.sql in the same
        # PR). The standalone add_*.sql files remain as the upgrade path
        # for pre-existing deployments.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - run: cd api && pytest tests/ -q

  worker-tests:
    runs-on: ubuntu-latest
    # R10 wave-3 gate fix: test_media_claim_reclaim.py (R10 WORK-5) hits a
    # real DB via lib/db.py, which falls back to postgres:5432 — a hostname
    # that only resolves inside the docker-compose network, not on a bare
    # runner. Mirror api-tests' postgres service + localhost DATABASE_URL
    # + schema load so worker-tests can actually reach a DB.
    services:
      postgres:
        image: pgvector/pgvector:pg16   # matches docker-compose.yml
        env:
          POSTGRES_USER: ficino
          POSTGRES_PASSWORD: ficino
          POSTGRES_DB: ficino
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ficino"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ficino:ficino@localhost:5432/ficino
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.lock
            worker/requirements.lock
      - run: pip install -r worker/requirements.lock
      - run: pip install -r worker/requirements-dev.txt
      - run: pip install ./shared
      - name: Load schema
        # init.sql is the FULL schema (migrations folded in — keep it that
        # way: any new add_*.sql must be folded into init.sql in the same
        # PR). The standalone add_*.sql files remain as the upgrade path
        # for pre-existing deployments.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - run: cd worker && pytest tests/ -q

  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.lock
            worker/requirements.lock
      - run: pip install ./shared pytest
      - run: python -m pytest shared/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc -b
      - run: cd frontend && npm run lint
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Shape A (plan 037): boot the full compose stack. .env.ci holds
      # CI-safe dummy values (no secrets); .env.secrets must merely EXIST
      # because docker-compose.yml lists it as an env_file.
      - name: Prepare CI env
        run: |
          cp .env.ci .env
          touch .env.secrets
          # tests/screenshots/ is gitignored; globalSetup also mkdirs it,
          # but create it here so even a globalSetup failure leaves the
          # artifact-upload path intact.
          mkdir -p tests/screenshots
      # --build: GH runners start with no images. init.sql loads
      # automatically via docker-entrypoint-initdb.d on the fresh postgres
      # volume (plan 022: it is the FULL schema) — do NOT re-apply it.
      - name: Boot the stack
        run: docker compose up -d --build --wait
      # The api image has no /app/uploads or /app/figures dirs, so Docker
      # creates the fresh named-volume mount points root:root while the
      # container runs as uid 10001 — neither the plan-036 fixture helper
      # nor any upload path can write until they're handed over. (A proper
      # fix belongs in api/Dockerfile; production code is out of plan 037's
      # scope.)
      - name: Chown writable volume dirs
        run: docker exec -u root ficino-api chown ficino:ficino /app/uploads /app/figures
      # This checkout's compose deliberately does NOT publish the frontend
      # port. Run a throwaway container from the same image with port 3000
      # published (same pattern as the local rehearsal's ficino-e2e-fe);
      # nginx inside it proxies /ficino/api/ to ficino-api over the compose
      # network.
      - name: Publish the frontend
        run: |
          FE_IMAGE=$(docker compose images -q frontend)
          docker run -d --name ficino-e2e-fe --network ficino-network -p 3000:80 "$FE_IMAGE"
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ficino/ && exit 0
            sleep 2
          done
          echo "frontend never came up" >&2
          exit 1
      - run: npx playwright install --with-deps chromium
      # The `ci` project (playwright.config.ts) is the fixture-runnable
      # desktop subset; globalSetup seeds the plan-036 fixtures first.
      # Trailing slash on the base URL is required.
      - name: Run e2e gate
        run: npx playwright test --project=ci
        env:
          E2E_BASE_URL: http://localhost:3000/ficino/
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            tests/results/
            tests/screenshots/
          if-no-files-found: ignore
