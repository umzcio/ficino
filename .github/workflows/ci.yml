name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      # The test harness starts pgvector/pgvector:pg18 with the docker CLI (preinstalled on runners).
      - run: cd server && npm ci && npm run typecheck && npm test

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.lock
            worker/requirements.lock
      - run: pip install ruff==0.15.20
      - run: ruff check api/ worker/ shared/

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # matches docker-compose.yml
        env:
          POSTGRES_USER: ficino
          POSTGRES_PASSWORD: ficino
          POSTGRES_DB: ficino
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ficino"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://ficino:ficino@localhost:5432/ficino
      REDIS_URL: redis://localhost:6379/0
      AUTH_PROVIDER: none
      ENVIRONMENT: test
      # Settings.upload_dir/figures_dir default to /app/... (the container
      # image's writable app root). The runner has no /app and can't create
      # one without sudo, so tests that write real files (e.g.
      # test_signed_figures.py) need these repointed at a writable path.
      # (job-level `env:` can't read the `runner` context, so this uses a
      # plain /tmp path rather than `${{ runner.temp }}`.)
      UPLOAD_DIR: /tmp/ficino-ci-uploads
      FIGURES_DIR: /tmp/ficino-ci-figures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.lock
            worker/requirements.lock
      - run: pip install -r api/requirements.lock
      - run: pip install -r api/requirements-dev.txt
      - run: pip install ./shared
      - name: Load schema
        # init.sql is the FULL schema (migrations folded in — keep it that
        # way: any new add_*.sql must be folded into init.sql in the same
        # PR). The standalone add_*.sql files remain as the upgrade path
        # for pre-existing deployments.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - run: cd api && pytest tests/ -q

  worker-tests:
    runs-on: ubuntu-latest
    # R10 wave-3 gate fix: test_media_claim_reclaim.py (R10 WORK-5) hits a
    # real DB via lib/db.py, which falls back to postgres:5432 — a hostname
    # that only resolves inside the docker-compose network, not on a bare
    # runner. Mirror api-tests' postgres service + localhost DATABASE_URL
    # + schema load so worker-tests can actually reach a DB.
    services:
      postgres:
        image: pgvector/pgvector:pg16   # matches docker-compose.yml
        env:
          POSTGRES_USER: ficino
          POSTGRES_PASSWORD: ficino
          POSTGRES_DB: ficino
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ficino"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ficino:ficino@localhost:5432/ficino
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.lock
            worker/requirements.lock
      - run: pip install -r worker/requirements.lock
      - run: pip install -r worker/requirements-dev.txt
      - run: pip install ./shared
      - name: Load schema
        # init.sql is the FULL schema (migrations folded in — keep it that
        # way: any new add_*.sql must be folded into init.sql in the same
        # PR). The standalone add_*.sql files remain as the upgrade path
        # for pre-existing deployments.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - run: cd worker && pytest tests/ -q

  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.lock
            worker/requirements.lock
      - run: pip install ./shared pytest
      - run: python -m pytest shared/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc -b
      - run: cd frontend && npm run lint
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

  e2e:
    # Pinned: ubuntu-latest now resolves to 26.04, and Playwright 1.59 has no chromium build for it
    # (`npx playwright install --with-deps chromium` fails there).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # tests/screenshots/ and tests/results/ are gitignored; create them up front so the artifact
      # upload and the stack log below have somewhere to go even when the stack never boots.
      - run: mkdir -p tests/screenshots tests/results
      # The throwaway loopback stack (docker-compose.e2e.yml, project ficino-e2e): builds the server and
      # web images (runners start with none), waits for every healthcheck, then for the web on
      # http://localhost:3070/ficino/. Providers point at a dead Ollama, so model calls fail at once.
      - name: Boot the TS stack
        run: scripts/e2e-stack.sh up
      - run: npx playwright install --with-deps chromium
      # The `ci` project (playwright.config.ts) is the fixture-runnable desktop subset; globalSetup
      # seeds the fixtures first. The script exports the base URL and the e2e container names and
      # writes the JSON report to tests/results/e2e-ci.json.
      - name: Run e2e gate
        run: scripts/e2e-stack.sh ci
      - name: Collect stack logs
        if: failure()
        run: scripts/e2e-stack.sh logs > tests/results/stack.log 2>&1
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            tests/results/
            tests/screenshots/
          if-no-files-found: ignore
      - name: Tear down the stack
        if: always()
        run: scripts/e2e-stack.sh down

  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The compose checks render with `docker compose config --no-env-resolution` and fail with a
      # clear message on a Compose without it. The ubuntu-24.04 image ships Compose v2.38, which has it;
      # print the version so a runner-image change that drops it is easy to spot.
      - run: docker compose version
      # Node built-ins only (no npm ci). Renders the compose files and runs throwaway containers
      # (nginx, a node stub, curl) on an internal network with no published port; the tests remove them.
      - run: npm run test:deploy
